<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>CHISPAS 3D · Feria Nocturna</title>
<style>
  html,body{margin:0;height:100%;background:#05030c;overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-tap-highlight-color:transparent;user-select:none;}
  canvas{display:block;touch-action:none;}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;color:#fff;font-family:inherit;}
  #hud-left{position:absolute;top:20px;left:22px;}
  .hud-label{font-size:11px;color:rgba(255,210,63,.7);font-weight:600;letter-spacing:1px;}
  .hud-score{font-size:34px;font-weight:700;color:#ffd23f;line-height:1;margin-top:4px;
    transition:transform .12s ease-out;transform-origin:left center;}
  .hud-score.pop{transform:scale(1.18);}
  .charge-bar{width:168px;height:9px;background:rgba(255,255,255,.08);border-radius:5px;
    margin-top:12px;overflow:hidden;}
  .charge-fill{height:100%;width:0%;background:rgba(255,210,63,.55);border-radius:5px;
    transition:width .08s linear,background .2s,box-shadow .2s;}
  .charge-fill.ready{background:#ffe27a;box-shadow:0 0 10px rgba(255,210,63,.7);}
  .charge-hint{font-size:10px;color:rgba(200,190,230,.5);margin-top:6px;letter-spacing:.5px;}
  .charge-hint.ready{color:#ffe27a;}
  #hud-center{position:absolute;top:20px;left:50%;transform:translateX(-50%);}
  .timer{font-size:26px;font-weight:700;color:rgba(230,225,255,.85);}
  .timer.low{color:#ff4d6d;}
  #hud-right{position:absolute;top:22px;right:22px;text-align:right;}
  .rival{margin-bottom:8px;}
  .rival-score{font-size:15px;font-weight:700;}
  .rival-name{font-size:10px;opacity:.45;letter-spacing:.5px;}

  /* ---------- Flash ---------- */
  #flash{position:fixed;inset:0;background:#ffe0a0;opacity:0;pointer-events:none;
    z-index:6;mix-blend-mode:screen;}

  /* ---------- Overlay (menú / fin de ronda) ---------- */
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(5,3,12,.78);backdrop-filter:blur(3px);z-index:8;color:#fff;text-align:center;
    padding:20px;font-family:inherit;}
  .overlay.show{display:flex;}
  .overlay-content{max-width:520px;}
  .overlay h1{font-size:clamp(38px,10vw,72px);color:#ffd23f;font-weight:800;letter-spacing:2px;
    margin:0 0 6px;text-shadow:0 0 40px rgba(255,210,63,.6);}
  .overlay .sub{font-size:12px;color:rgba(190,180,225,.75);letter-spacing:4px;margin:0 0 38px;}
  .overlay .howto{font-size:14px;line-height:1.65;color:rgba(230,225,255,.85);margin:0 0 22px;}
  .overlay .howto strong{color:#ffd23f;}
  .overlay .controls{font-size:12px;color:rgba(180,170,215,.6);margin-bottom:34px;}
  .overlay .cta{font-size:15px;font-weight:700;color:rgba(255,255,255,.9);
    animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.45;}50%{opacity:1;}}
  .overlay .winner{font-size:18px;font-weight:700;margin:0 0 26px;}
  .overlay .ranking{list-style:none;padding:0;margin:0 0 30px;font-size:18px;}
  .overlay .ranking li{margin-bottom:8px;font-weight:700;}

  /* ---------- Botones ---------- */
  #ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;justify-content:center;
    padding:8px;pointer-events:none;z-index:10;}
  #ui button{pointer-events:auto;cursor:pointer;border:1px solid #3a2f5c;border-radius:8px;
    background:rgba(20,16,38,.82);color:#cfc6f0;font:600 11px ui-monospace,monospace;
    padding:6px 10px;letter-spacing:.5px;transition:background .15s,border-color .15s;}
  #ui button:hover{background:rgba(40,32,70,.95);border-color:#6b57b8;}
  #ui button.off{opacity:.4;}
  #ui button:focus-visible{outline:2px solid #ffd23f;outline-offset:2px;}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="hud-left">
    <div class="hud-label">TÚ</div>
    <div class="hud-score" id="playerScore">0</div>
    <div class="charge-bar"><div class="charge-fill" id="chargeFill"></div></div>
    <div class="charge-hint" id="chargeHint">CHOCA PARA CARGAR</div>
  </div>
  <div id="hud-center"><div class="timer" id="timer">1:30</div></div>
  <div id="hud-right"></div>
</div>

<div id="flash"></div>

<div class="overlay show" id="overlay">
  <div class="overlay-content" id="overlayContent"></div>
</div>

<div id="ui">
  <button id="btnSound" aria-pressed="true">🔊 Sonido</button>
  <button id="btnShake" aria-pressed="true">📳 Sacudida</button>
  <button id="btnFlash" aria-pressed="true">✨ Destellos</button>
  <button id="btnBloom" aria-pressed="true">💡 Brillo</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ==========================================================
   CHISPAS 3D · Feria Nocturna
   Three.js r160 · módulo único, sin build step.
   ========================================================== */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

/* ---------------- constantes ---------------- */
const ARENA_R      = 16;
const FOCO_R       = 4.5;
const CAR_R        = 1.1;
const THRUST       = 30;
const MAX_SPEED    = 12;
const DAMP         = 2.4;
const RESTITUTION  = 0.55;
const MIN_CHARGE   = 25;
const MULT_FOCO    = 3;
const DISCHARGE_CD = 0.75;
const ROUND_LEN    = 90;
const MAX_PARTICLES = 600;

const COLORS = [0xffd23f, 0xff4d6d, 0x4dd4ff, 0x8affc1];
const NAMES  = ['TÚ', 'ROJO', 'CIAN', 'VERDE'];

/* ---------------- opciones accesibilidad ---------------- */
const opts = { sound: true, shake: true, flash: true, bloom: true };

/* ---------------- estado ---------------- */
const state = {
  mode: 'menu',        // 'menu' | 'play' | 'over'
  time: 0,
  remaining: ROUND_LEN,
  shake: 0,
  flash: 0,
  hitstop: 0,
  endTimer: 0,
};

let cars = [];
let player = null;

/* ---------------- renderer / escena ---------------- */
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05030c);
scene.fog = new THREE.Fog(0x05030c, 32, 70);

const camera = new THREE.PerspectiveCamera(
  58, window.innerWidth / window.innerHeight, 0.1, 200
);
camera.position.set(0, 20, 12);

/* ---------------- post-procesado ---------------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth * 0.5, window.innerHeight * 0.5),
  0.95, 0.55, 0.35
);
composer.addPass(bloomPass);

/* ---------------- luces ---------------- */
scene.add(new THREE.AmbientLight(0x3a2f5c, 1.3));

const dir = new THREE.DirectionalLight(0xffffff, 2.2);
dir.position.set(6, 18, 10);
scene.add(dir);

const hemi = new THREE.HemisphereLight(0x2a2050, 0x080616, 0.9);
scene.add(hemi);

const focoLight = new THREE.PointLight(0xffb040, 40, 26, 2);
focoLight.position.set(0, 3, 0);
scene.add(focoLight);

/* ---------------- texturas procedurales ---------------- */
function createGlowTexture(size = 64) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0,   'rgba(255,255,255,1)');
  grad.addColorStop(0.3, 'rgba(255,255,255,0.8)');
  grad.addColorStop(1,   'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createGridTexture(size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = '#0a0818';
  g.fillRect(0, 0, size, size);
  g.strokeStyle = 'rgba(120,100,200,0.18)';
  g.lineWidth = 2;
  const step = size / 8;
  for (let i = 0; i <= 8; i++) {
    g.beginPath(); g.moveTo(i*step, 0); g.lineTo(i*step, size); g.stroke();
    g.beginPath(); g.moveTo(0, i*step); g.lineTo(size, i*step); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(15, 15);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

const glowTex = createGlowTexture(64);
const gridTex = createGridTexture(256);

/* ---------------- suelo ---------------- */
const floorGeo = new THREE.PlaneGeometry(70, 70);
const floorMat = new THREE.MeshStandardMaterial({
  map: gridTex,
  color: 0xffffff,
  metalness: 0.35,
  roughness: 0.75,
  emissive: 0x0a0820,
  emissiveIntensity: 0.4,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
scene.add(floor);

/* ---------------- aro de la arena ---------------- */
const edgeRing = new THREE.Mesh(
  new THREE.TorusGeometry(ARENA_R, 0.13, 6, 80),
  new THREE.MeshBasicMaterial({ color: 0x8a7aff })
);
edgeRing.rotation.x = -Math.PI / 2;
edgeRing.position.y = 0.12;
scene.add(edgeRing);

/* ---------------- bombillas del borde ---------------- */
const bulbGeo = new THREE.SphereGeometry(0.16, 8, 6);
const bulbs = [];
const BULB_N = 32;
for (let i = 0; i < BULB_N; i++) {
  const a = (i / BULB_N) * TAU;
  const mat = new THREE.MeshBasicMaterial({ color: 0xffd23f });
  const b = new THREE.Mesh(bulbGeo, mat);
  b.position.set(Math.cos(a) * (ARENA_R + 0.4), 0.35, Math.sin(a) * (ARENA_R + 0.4));
  scene.add(b);
  bulbs.push(b);
}

/* ---------------- FOCO ---------------- */
// haz vertical
const beamMat = new THREE.MeshBasicMaterial({
  color: 0xffd23f,
  transparent: true,
  opacity: 0.18,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.DoubleSide,
});
const beam = new THREE.Mesh(
  new THREE.CylinderGeometry(FOCO_R, FOCO_R * 0.72, 26, 24, 1, true),
  beamMat
);
beam.position.y = 13;
scene.add(beam);

// halo en el suelo
const focoGlow = new THREE.Mesh(
  new THREE.CircleGeometry(FOCO_R * 1.25, 56),
  new THREE.MeshBasicMaterial({
    map: glowTex,
    color: 0xffd23f,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  })
);
focoGlow.rotation.x = -Math.PI / 2;
focoGlow.position.y = 0.03;
scene.add(focoGlow);

// aro en el suelo
const focoRing = new THREE.Mesh(
  new THREE.TorusGeometry(FOCO_R, 0.08, 6, 64),
  new THREE.MeshBasicMaterial({ color: 0xffe27a })
);
focoRing.rotation.x = -Math.PI / 2;
focoRing.position.y = 0.05;
scene.add(focoRing);

/* ---------------- rueda de feria al fondo ---------------- */
const fwGroup = new THREE.Group();
fwGroup.position.set(-26, 13, -24);
fwGroup.rotation.y = 0.42;

const fwRing = new THREE.Mesh(
  new THREE.TorusGeometry(9, 0.13, 6, 40),
  new THREE.MeshBasicMaterial({ color: 0x8a7aff })
);
fwGroup.add(fwRing);

const fwSpokes = new THREE.Group();
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * TAU;
  const pts = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(Math.cos(a) * 9, Math.sin(a) * 9, 0),
  ];
  fwSpokes.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x8a7aff, transparent: true, opacity: 0.6 })
  ));
  const gond = new THREE.Mesh(
    new THREE.SphereGeometry(0.32, 6, 4),
    new THREE.MeshBasicMaterial({ color: i % 2 ? 0xff8ecf : 0x4dd4ff })
  );
  gond.position.set(Math.cos(a) * 9, Math.sin(a) * 9, 0);
  fwSpokes.add(gond);
}
fwGroup.add(fwSpokes);

// patas
for (const s of [-1, 1]) {
  const pts = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(s * 5, -13, 0),
  ];
  fwGroup.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x6a52b0, transparent: true, opacity: 0.5 })
  ));
}
scene.add(fwGroup);

/* ---------------- partículas ---------------- */
const pPositions = new Float32Array(MAX_PARTICLES * 3);
const pColors    = new Float32Array(MAX_PARTICLES * 3);
const pData = [];

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
particleGeo.setAttribute('color',    new THREE.BufferAttribute(pColors, 3));
particleGeo.setDrawRange(0, 0);

const particleSys = new THREE.Points(particleGeo, new THREE.PointsMaterial({
  size: 0.55,
  map: glowTex,
  vertexColors: true,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true,
}));
particleSys.frustumCulled = false;
scene.add(particleSys);

function emitSparks(x, y, z, count, speed, colorHex, upward) {
  const col = new THREE.Color(colorHex);
  for (let i = 0; i < count && pData.length < MAX_PARTICLES; i++) {
    const theta = Math.random() * TAU;
    let phi = Math.random() * Math.PI;
    if (upward) phi = Math.random() * Math.PI * 0.5;
    const s = speed * (0.3 + Math.random() * 0.7);
    const sinPhi = Math.sin(phi);
    pData.push({
      x, y, z,
      vx: sinPhi * Math.cos(theta) * s,
      vy: upward ? Math.abs(Math.cos(phi)) * s : Math.cos(phi) * s,
      vz: sinPhi * Math.sin(theta) * s,
      life: 0.6 + Math.random() * 0.7,
      maxLife: 1.3,
      r: col.r, g: col.g, b: col.b,
    });
  }
}

function updateParticles(dt) {
  for (let i = pData.length - 1; i >= 0; i--) {
    const p = pData[i];
    p.life -= dt;
    if (p.life <= 0) { pData.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    p.vy -= 16 * dt;
    const d = Math.exp(-1.5 * dt);
    p.vx *= d; p.vz *= d;
  }
  const n = pData.length;
  for (let i = 0; i < n; i++) {
    const p = pData[i];
    pPositions[i*3]     = p.x;
    pPositions[i*3 + 1] = p.y;
    pPositions[i*3 + 2] = p.z;
    const a = p.life / p.maxLife;
    pColors[i*3]     = p.r * a;
    pColors[i*3 + 1] = p.g * a;
    pColors[i*3 + 2] = p.b * a;
  }
  particleGeo.attributes.position.needsUpdate = true;
  particleGeo.attributes.color.needsUpdate = true;
  particleGeo.setDrawRange(0, n);
}

/* ---------------- ondas de choque ---------------- */
const SHOCK_POOL = 8;
const shocks = [];
for (let i = 0; i < SHOCK_POOL; i++) {
  const m = new THREE.Mesh(
    new THREE.TorusGeometry(1, 0.1, 4, 24),
    new THREE.MeshBasicMaterial({
      color: 0xffd23f, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false,
    })
  );
  m.rotation.x = -Math.PI / 2;
  m.visible = false;
  scene.add(m);
  shocks.push({ mesh: m, life: 0, maxLife: 1, maxScale: 1 });
}
let shockIdx = 0;

function addShock(x, y, z, maxScale, colorHex, life) {
  const s = shocks[shockIdx];
  shockIdx = (shockIdx + 1) % SHOCK_POOL;
  s.mesh.position.set(x, y, z);
  s.mesh.scale.setScalar(0.3);
  s.mesh.material.color.setHex(colorHex);
  s.mesh.material.opacity = 1;
  s.mesh.visible = true;
  s.life = life;
  s.maxLife = life;
  s.maxScale = maxScale;
}

function updateShocks(dt) {
  for (const s of shocks) {
    if (s.life <= 0) continue;
    s.life -= dt;
    if (s.life <= 0) { s.mesh.visible = false; continue; }
    const t = 1 - s.life / s.maxLife;
    s.mesh.scale.setScalar(0.3 + (s.maxScale - 0.3) * t);
    s.mesh.material.opacity = (1 - t) * 0.8;
  }
}

/* ---------------- textos flotantes (sprites) ---------------- */
const floaters = [];

function addFloater(x, y, z, text, colorHex) {
  const cw = 192, ch = 48;
  const cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d');
  g.font = 'bold 34px ui-monospace, monospace';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = '#' + colorHex.toString(16).padStart(6, '0');
  g.fillText(text, cw / 2, ch / 2);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false,
  }));
  sprite.position.set(x, y, z);
  sprite.scale.set(3, 0.75, 1);
  scene.add(sprite);
  floaters.push({ sprite, tex, life: 1.2, maxLife: 1.2 });
}

function updateFloaters(dt) {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt;
    f.sprite.position.y += 2.2 * dt;
    f.sprite.material.opacity = clamp(f.life / f.maxLife, 0, 1);
    if (f.life <= 0) {
      scene.remove(f.sprite);
      f.sprite.material.dispose();
      f.tex.dispose();
      floaters.splice(i, 1);
    }
  }
}

/* ---------------- coche ---------------- */
function createCar(index, isPlayer) {
  const color = COLORS[index];
  const group = new THREE.Group();

  // cuerpo (cápsula aplastada)
  const bodyGeo = new THREE.CapsuleGeometry(0.7, 1.0, 4, 12);
  bodyGeo.rotateX(Math.PI / 2);
  const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({
    color, metalness: 0.4, roughness: 0.4,
    emissive: color, emissiveIntensity: 0.15,
  }));
  body.scale.set(1, 0.65, 1);
  body.position.y = 0.5;
  group.add(body);

  // pértiga
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.05, 1.5, 8),
    new THREE.MeshStandardMaterial({
      color: 0xaaaaaa, metalness: 0.9, roughness: 0.2,
      emissive: 0x223355, emissiveIntensity: 0.5,
    })
  );
  pole.position.y = 1.6;
  group.add(pole);

  // chispa en la punta
  const spark = new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 12, 10),
    new THREE.MeshBasicMaterial({ color })
  );
  spark.position.y = 2.45;
  group.add(spark);

  // sprite glow
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  glow.position.y = 2.45;
  glow.scale.setScalar(1.5);
  group.add(glow);

  // sombra
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(1.2, 16),
    new THREE.MeshBasicMaterial({
      color: 0x000000, transparent: true, opacity: 0.45, depthWrite: false,
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.02;
  group.add(shadow);

  scene.add(group);

  return {
    group, body, pole, spark, glow,
    x: 0, z: 0, vx: 0, vz: 0, angle: 0,
    r: CAR_R, mass: 1,
    color, name: NAMES[index], isPlayer,
    chispa: 0, score: 0, cd: 0,
    hitFlash: 0, inFoco: false,
    ai: { greed: 40 + Math.random() * 55, seed: Math.random() * 1000, overTimer: 0 },
  };
}

/* ---------------- audio ---------------- */
let actx = null, master = null;

function ensureAudio() {
  if (actx) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.28;
    master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function audioReady() {
  if (!actx) return false;
  if (actx.state === 'suspended') actx.resume();
  return opts.sound;
}

function sfxBump(impact) {
  if (!audioReady()) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(120 + Math.min(360, impact), t);
  o.frequency.exponentialRampToValueAtTime(55, t + 0.11);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.20, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.2);
}

function sfxDischarge(power, inFoco) {
  if (!audioReady()) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(inFoco ? 900 : 520, t);
  o.frequency.exponentialRampToValueAtTime(70, t + 0.38);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.18 + power * 0.001, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.44);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.45);
  if (inFoco) {
    const o2 = actx.createOscillator(), g2 = actx.createGain();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(1320, t);
    o2.frequency.exponentialRampToValueAtTime(2200, t + 0.14);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.10, t + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o2.connect(g2); g2.connect(master);
    o2.start(t); o2.stop(t + 0.25);
  }
}

function sfxTone(freq, dur, type, vol) {
  if (!audioReady()) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}

/* ---------------- física ---------------- */
function shortAngle(a, b) {
  let d = b - a;
  while (d >  Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return d;
}

function updateCarPhysics(car, dt, ix, iz) {
  car.mass = 1 + car.chispa / 180;
  const mag = Math.hypot(ix, iz);
  if (mag > 1) { ix /= mag; iz /= mag; }

  const accel = THRUST / car.mass;
  car.vx += ix * accel * dt;
  car.vz += iz * accel * dt;

  const damp = Math.exp(-DAMP * dt);
  car.vx *= damp;
  car.vz *= damp;

  const speed = Math.hypot(car.vx, car.vz);
  if (speed > MAX_SPEED) {
    car.vx = car.vx / speed * MAX_SPEED;
    car.vz = car.vz / speed * MAX_SPEED;
  }

  car.x += car.vx * dt;
  car.z += car.vz * dt;

  // límite circular
  const dist = Math.hypot(car.x, car.z) || 1;
  const lim = ARENA_R - car.r;
  if (dist > lim) {
    const nx = car.x / dist, nz = car.z / dist;
    car.x = nx * lim;
    car.z = nz * lim;
    const vn = car.vx * nx + car.vz * nz;
    if (vn > 0) {
      car.vx -= vn * nx * 1.55;
      car.vz -= vn * nz * 1.55;
      if (vn > 4) {
        emitSparks(car.x - nx * car.r, 0.5, car.z - nz * car.r, 6, vn * 0.6, car.color);
        addShake(vn * 0.15);
        sfxBump(vn * 3);
      }
    }
  }

  // orientación
  if (speed > 0.5) {
    const target = Math.atan2(car.vx, car.vz);
    car.angle += shortAngle(car.angle, target) * (1 - Math.exp(-13 * dt));
  }

  if (car.cd > 0) car.cd = Math.max(0, car.cd - dt);
  if (car.hitFlash > 0) car.hitFlash = Math.max(0, car.hitFlash - dt * 3.6);

  // sincronizar visual
  car.group.position.set(car.x, 0, car.z);
  car.group.rotation.y = car.angle;

  const pct = car.chispa / 100;
  car.spark.scale.setScalar(0.5 + pct * 1.5);
  car.glow.scale.setScalar(1.0 + pct * 2.5);
  car.glow.material.opacity = 0.35 + pct * 0.65;
  car.body.material.emissiveIntensity = 0.15 + pct * 0.55 + (car.inFoco ? 0.3 : 0);
}

function collideCars(a, b) {
  const dx = b.x - a.x, dz = b.z - a.z;
  const d = Math.hypot(dx, dz);
  const minD = a.r + b.r;
  if (d >= minD || d < 0.0001) return;

  const nx = dx / d, nz = dz / d;
  const invA = 1 / a.mass, invB = 1 / b.mass;
  const total = invA + invB;
  const overlap = minD - d;

  a.x -= nx * overlap * (invA / total);
  a.z -= nz * overlap * (invA / total);
  b.x += nx * overlap * (invB / total);
  b.z += nz * overlap * (invB / total);

  const rvx = b.vx - a.vx, rvz = b.vz - a.vz;
  const vn = rvx * nx + rvz * nz;
  if (vn > 0) return;

  const j = -(1 + RESTITUTION) * vn / total;
  a.vx -= j * nx * invA;
  a.vz -= j * nz * invA;
  b.vx += j * nx * invB;
  b.vz += j * nz * invB;

  const impact = Math.abs(vn);
  if (impact > 1.2) {
    const gain = Math.min(40, 4 + impact * 4);
    a.chispa = Math.min(100, a.chispa + gain);
    b.chispa = Math.min(100, b.chispa + gain);
    a.hitFlash = 1;
    b.hitFlash = 1;

    const mx = a.x + nx * a.r;
    const mz = a.z + nz * a.r;
    emitSparks(mx, 0.8, mz, Math.min(16, 4 + (impact * 2.5) | 0), impact * 3, 0xffe9a8);
    addShock(mx, 0.2, mz, 1.6 + impact * 0.22, 0xffe9a8, 0.35);

    if (impact > 4) addShake(impact * 0.28);
    if (impact > 6) state.hitstop = Math.min(0.07, impact * 0.01);
    sfxBump(impact * 20);
  }
}

/* ---------------- descarga ---------------- */
function tryDischarge(car) {
  if (car.cd > 0 || car.chispa < MIN_CHARGE) return false;

  const inFoco = Math.hypot(car.x, car.z) < FOCO_R;
  const power = car.chispa;
  const pts = Math.round(power * (inFoco ? MULT_FOCO : 1));

  car.score += pts;
  car.chispa = 0;
  car.cd = DISCHARGE_CD;

  // onda expansiva sobre rivales
  const RANGE = 4.5;
  for (const other of cars) {
    if (other === car) continue;
    const dx = other.x - car.x, dz = other.z - car.z;
    const d = Math.hypot(dx, dz) || 1;
    if (d < RANGE) {
      const f = (1 - d / RANGE) * (3 + power * 0.07) / other.mass;
      other.vx += (dx / d) * f;
      other.vz += (dz / d) * f;
      other.chispa = Math.min(100, other.chispa + 5);
      other.hitFlash = 0.7;
    }
  }

  const col = inFoco ? 0xffd23f : car.color;
  emitSparks(car.x, 1.5, car.z, inFoco ? 42 : 20, 10 + power * 0.16, col, true);
  addShock(car.x, 0.15, car.z, 3.5 + power * 0.03, col, 0.5);
  addFloater(car.x, 3, car.z, '+' + pts + (inFoco ? ' ×3' : ''), col);

  if (inFoco) {
    addShake(1.2);
    if (opts.flash) state.flash = Math.min(state.flash + 0.6, 0.75);
    focoLight.intensity = 90;
  }

  if (car.isPlayer) {
    const el = document.getElementById('playerScore');
    el.classList.add('pop');
    setTimeout(() => el.classList.remove('pop'), 130);
  }

  sfxDischarge(power, inFoco);
  return true;
}

/* ---------------- IA ---------------- */
function updateAI(car, dt) {
  const ai = car.ai;
  const distC = Math.hypot(car.x, car.z);

  let tx = 0, tz = 0;
  if (car.chispa >= ai.greed) {
    tx = 0; tz = 0;
  } else {
    let best = null, bd = Infinity;
    for (const other of cars) {
      if (other === car) continue;
      const d = Math.hypot(other.x - car.x, other.z - car.z);
      if (d < bd) { bd = d; best = other; }
    }
    if (best) {
      tx = best.x + best.vx * 0.22;
      tz = best.z + best.vz * 0.22;
    }
  }

  let dx = tx - car.x, dz = tz - car.z;
  const dl = Math.hypot(dx, dz) || 1;
  dx /= dl; dz /= dl;

  const edge = ARENA_R - 4;
  if (distC > edge) {
    const w = clamp((distC - edge) / 4, 0, 1);
    dx += (-car.x / distC) * w * 2.6;
    dz += (-car.z / distC) * w * 2.6;
    const l = Math.hypot(dx, dz) || 1;
    dx /= l; dz /= l;
  }

  const jitter = Math.sin(state.time * 1.9 + ai.seed) * 0.18;
  const cj = Math.cos(jitter), sj = Math.sin(jitter);
  const rx = dx * cj - dz * sj;
  const rz = dx * sj + dz * cj;

  updateCarPhysics(car, dt, rx, rz);

  if (car.cd <= 0 && car.chispa >= MIN_CHARGE) {
    const inFoco = Math.hypot(car.x, car.z) < FOCO_R * 0.9;
    if (inFoco && car.chispa >= ai.greed) {
      tryDischarge(car);
      ai.overTimer = 0;
    } else if (car.chispa >= 92) {
      ai.overTimer += dt;
      if (ai.overTimer > 2.2) { tryDischarge(car); ai.overTimer = 0; }
    } else {
      ai.overTimer = 0;
    }
  }
}

/* ---------------- cámara ---------------- */
const camPos = new THREE.Vector3(0, 20, 12);
const camLookAt = new THREE.Vector3(0, 0, 0);

function addShake(amount) {
  if (!opts.shake) return;
  state.shake = Math.min(state.shake + amount, 3.5);
}

function updateCamera(dt) {
  if (!player) return;

  const speed = Math.hypot(player.vx, player.vz);
  const tx = player.x * 0.5 + player.vx * 0.08;
  const tz = player.z * 0.5 + player.vz * 0.08;

  const k = 1 - Math.exp(-5 * dt);
  camPos.x += (tx - camPos.x) * k;
  camPos.y += (20 - camPos.y) * k;
  camPos.z += ((tz + 12) - camPos.z) * k;

  camera.position.copy(camPos);
  if (opts.shake && state.shake > 0.05) {
    camera.position.x += (Math.random() - 0.5) * state.shake * 0.35;
    camera.position.y += (Math.random() - 0.5) * state.shake * 0.22;
    camera.position.z += (Math.random() - 0.5) * state.shake * 0.35;
  }

  camLookAt.set(tx, 0, tz);
  camera.lookAt(camLookAt);

  const targetFov = 58 + (speed / MAX_SPEED) * 12;
  camera.fov += (targetFov - camera.fov) * (1 - Math.exp(-5 * dt));
  camera.updateProjectionMatrix();
}

/* ---------------- input ---------------- */
const keys = Object.create(null);
let stick = null;
const stickVec = { x: 0, z: 0 };

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k] = true;

  ensureAudio();
  if (actx && actx.state === 'suspended') actx.resume();

  if (k === ' ' || k === 'enter') {
    if (state.mode === 'play' && player && k === ' ') tryDischarge(player);
    else if (state.mode === 'menu') startRound();
    else if (state.mode === 'over' && state.endTimer > 0.6) startRound();
  }
  if (k === 'r' && state.mode === 'play') startRound();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function readInput() {
  let x = 0, z = 0;
  if (keys['a'] || keys['arrowleft'])  x -= 1;
  if (keys['d'] || keys['arrowright']) x += 1;
  if (keys['w'] || keys['arrowup'])    z -= 1;
  if (keys['s'] || keys['arrowdown'])  z += 1;
  if (stick) { x += stickVec.x; z += stickVec.z; }
  return { x, z };
}

canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  if (actx && actx.state === 'suspended') actx.resume();

  if (state.mode !== 'play') {
    if (state.mode === 'menu' || state.endTimer > 0.6) startRound();
    return;
  }
  if (e.pointerType === 'touch') {
    if (e.clientX < window.innerWidth / 2 && !stick) {
      stick = { id: e.pointerId, ox: e.clientX, oy: e.clientY, cx: e.clientX, cy: e.clientY };
      stickVec.x = 0; stickVec.z = 0;
    } else if (e.clientX >= window.innerWidth / 2 && player) {
      tryDischarge(player);
    }
  }
}, { passive: true });

canvas.addEventListener('pointermove', e => {
  if (!stick || e.pointerId !== stick.id) return;
  stick.cx = e.clientX;
  stick.cy = e.clientY;
  const R = 60;
  let dx = e.clientX - stick.ox;
  let dy = e.clientY - stick.oy;
  const d = Math.hypot(dx, dy);
  if (d > R) { dx = dx / d * R; dy = dy / d * R; }
  stickVec.x = dx / R;
  stickVec.z = dy / R;
}, { passive: true });

function endStick(e) {
  if (stick && e.pointerId === stick.id) {
    stick = null; stickVec.x = 0; stickVec.z = 0;
  }
}
canvas.addEventListener('pointerup', endStick, { passive: true });
canvas.addEventListener('pointercancel', endStick, { passive: true });

/* ---------------- HUD / overlay ---------------- */
const playerScoreEl = document.getElementById('playerScore');
const chargeFillEl  = document.getElementById('chargeFill');
const chargeHintEl  = document.getElementById('chargeHint');
const timerEl       = document.getElementById('timer');
const rivalsEl      = document.getElementById('hud-right');
const overlayEl     = document.getElementById('overlay');
const overlayContent = document.getElementById('overlayContent');
const flashEl       = document.getElementById('flash');

function buildRivalsHUD() {
  rivalsEl.innerHTML = '';
  for (let i = 1; i < 4; i++) {
    const c = cars[i];
    const hex = c.color.toString(16).padStart(6, '0');
    const div = document.createElement('div');
    div.className = 'rival';
    div.innerHTML =
      `<div class="rival-score" style="color:#${hex}">0</div>` +
      `<div class="rival-name">${c.name}</div>`;
    rivalsEl.appendChild(div);
  }
}

function updateHUD() {
  if (!player) return;
  playerScoreEl.textContent = player.score;
  const pct = player.chispa / 100;
  chargeFillEl.style.width = (pct * 100) + '%';
  const ready = player.chispa >= MIN_CHARGE;
  chargeFillEl.classList.toggle('ready', ready);
  chargeHintEl.classList.toggle('ready', ready);
  chargeHintEl.textContent = ready ? 'ESPACIO → DESCARGAR' : 'CHOCA PARA CARGAR';
  timerEl.textContent = fmtTime(state.remaining);
  timerEl.classList.toggle('low', state.remaining <= 10);
  const kids = rivalsEl.children;
  for (let i = 1; i < 4; i++) {
    if (kids[i-1]) kids[i-1].querySelector('.rival-score').textContent = cars[i].score;
  }
}

function fmtTime(s) {
  s = Math.max(0, Math.ceil(s));
  const m = Math.floor(s / 60), r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}

function showMenu() {
  overlayContent.innerHTML =
    `<h1>CHISPAS</h1>` +
    `<p class="sub">3 D · F E R I A   N O C T U R N A</p>` +
    `<p class="howto">Choca para cargar chispa.<br>` +
    `Descárgala <strong>dentro del haz de luz central</strong> → ×3 puntos.</p>` +
    `<p class="controls">WASD / Flechas  ·  ESPACIO descargar</p>` +
    `<p class="cta">PULSA  ESPACIO  PARA JUGAR</p>`;
  overlayEl.classList.add('show');
}

function showGameOver() {
  const sorted = cars.slice().sort((a, b) => b.score - a.score);
  const winner = sorted[0];
  let ranking = '<ul class="ranking">';
  for (let i = 0; i < sorted.length; i++) {
    const c = sorted[i];
    const hex = c.color.toString(16).padStart(6, '0');
    ranking += `<li style="color:#${hex};opacity:${c.isPlayer ? 1 : 0.8}">` +
               `${i+1}.&nbsp;&nbsp;${c.name.padEnd(6,' ')}&nbsp;&nbsp;${c.score}</li>`;
  }
  ranking += '</ul>';
  overlayContent.innerHTML =
    `<h1>FIN DE RONDA</h1>` +
    `<p class="winner" style="color:#${winner.color.toString(16).padStart(6,'0')}">` +
      (winner.isPlayer ? '¡GANAS TÚ!' : 'GANA ' + winner.name) +
      ' · ' + winner.score + ' pts</p>' +
    ranking +
    `<p class="cta">ESPACIO / ENTER · REVANCHA</p>`;
  overlayEl.classList.add('show');
}

/* ---------------- ciclo de ronda ---------------- */
function startRound() {
  ensureAudio();

  // limpiar efectos
  pData.length = 0;
  particleGeo.setDrawRange(0, 0);
  for (const f of floaters) {
    scene.remove(f.sprite);
    f.sprite.material.dispose();
    f.tex.dispose();
  }
  floaters.length = 0;
  for (const s of shocks) { s.life = 0; s.mesh.visible = false; }

  // crear / resetear coches
  if (cars.length === 0) {
    for (let i = 0; i < 4; i++) cars.push(createCar(i, i === 0));
  }
  for (let i = 0; i < 4; i++) {
    const a = -Math.PI / 2 + (i / 4) * TAU;
    const c = cars[i];
    c.x = Math.cos(a) * ARENA_R * 0.55;
    c.z = Math.sin(a) * ARENA_R * 0.55;
    c.vx = 0; c.vz = 0;
    c.angle = a + Math.PI;
    c.chispa = 0; c.score = 0; c.cd = 0;
    c.hitFlash = 0; c.mass = 1; c.inFoco = false;
    c.ai.greed = 40 + Math.random() * 55;
    c.ai.overTimer = 0;
    c.group.position.set(c.x, 0, c.z);
    c.group.rotation.y = c.angle;
  }
  player = cars[0];
  buildRivalsHUD();

  state.mode = 'play';
  state.remaining = ROUND_LEN;
  state.time = 0;
  state.shake = 0;
  state.flash = 0;
  state.hitstop = 0;
  state.endTimer = 0;

  camPos.set(0, 20, 12);
  overlayEl.classList.remove('show');
  updateHUD();
}

function endRound() {
  state.mode = 'over';
  state.endTimer = 0;
  showGameOver();
  sfxTone(440, 0.5, 'triangle', 0.1);
}

/* ---------------- update principal ---------------- */
function update(dt) {
  state.time += dt;
  state.shake *= Math.exp(-8 * dt);
  state.flash *= Math.exp(-5.5 * dt);
  state.endTimer += dt;

  // flash DOM
  flashEl.style.opacity = (opts.flash && state.flash > 0.01)
    ? (state.flash * 0.55).toFixed(3) : '0';

  // ambiente (siempre)
  const pulse = 0.5 + 0.5 * Math.sin(state.time * 2.6);
  focoLight.intensity += ((opts.flash && state.flash > 0.1 ? 90 : 40) - focoLight.intensity) * (1 - Math.exp(-6 * dt));
  beamMat.opacity = 0.14 + pulse * 0.08;
  focoGlow.material.opacity = 0.45 + pulse * 0.2;
  for (let i = 0; i < bulbs.length; i++) {
    const p = 0.5 + 0.5 * Math.sin(state.time * 3 + i * 0.7);
    bulbs[i].material.color.setRGB(1, 0.82, 0.25);
    bulbs[i].material.color.multiplyScalar(0.5 + p * 0.5);
    bulbs[i].scale.setScalar(0.8 + p * 0.4);
  }
  fwSpokes.rotation.z += dt * 0.15;

  if (state.hitstop > 0) {
    state.hitstop -= dt;
    updateCamera(dt);
    updateParticles(dt);
    updateShocks(dt);
    updateFloaters(dt);
    return;
  }

  if (state.mode === 'play') {
    state.remaining -= dt;
    if (state.remaining <= 0) {
      state.remaining = 0;
      endRound();
      return;
    }

    const input = readInput();
    for (const c of cars) {
      if (c.isPlayer) updateCarPhysics(c, dt, input.x, input.z);
      else updateAI(c, dt);
    }

    for (let i = 0; i < cars.length; i++)
      for (let j = i + 1; j < cars.length; j++)
        collideCars(cars[i], cars[j]);

    for (const c of cars) {
      c.inFoco = Math.hypot(c.x, c.z) < FOCO_R;
    }

    updateHUD();
  }

  updateCamera(dt);
  updateParticles(dt);
  updateShocks(dt);
  updateFloaters(dt);
}

/* ---------------- render ---------------- */
function render() {
  if (opts.bloom) composer.render();
  else renderer.render(scene, camera);
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 1 / 25) dt = 1 / 25;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---------------- resize ---------------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloomPass.setSize(w * 0.5, h * 0.5);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ---------------- botones ---------------- */
const btnSound = document.getElementById('btnSound');
const btnShake = document.getElementById('btnShake');
const btnFlash = document.getElementById('btnFlash');
const btnBloom = document.getElementById('btnBloom');

function syncButtons() {
  btnSound.classList.toggle('off', !opts.sound);
  btnShake.classList.toggle('off', !opts.shake);
  btnFlash.classList.toggle('off', !opts.flash);
  btnBloom.classList.toggle('off', !opts.bloom);
  btnSound.setAttribute('aria-pressed', String(opts.sound));
  btnShake.setAttribute('aria-pressed', String(opts.shake));
  btnFlash.setAttribute('aria-pressed', String(opts.flash));
  btnBloom.setAttribute('aria-pressed', String(opts.bloom));
}
btnSound.addEventListener('click', () => {
  opts.sound = !opts.sound;
  if (opts.sound) { ensureAudio(); if (actx) actx.resume(); }
  syncButtons();
});
btnShake.addEventListener('click', () => {
  opts.shake = !opts.shake;
  if (!opts.shake) state.shake = 0;
  syncButtons();
});
btnFlash.addEventListener('click', () => {
  opts.flash = !opts.flash;
  if (!opts.flash) state.flash = 0;
  syncButtons();
});
btnBloom.addEventListener('click', () => {
  opts.bloom = !opts.bloom;
  syncButtons();
});

/* ---------------- arranque ---------------- */
resize();
syncButtons();
showMenu();
requestAnimationFrame(frame);

</script>
