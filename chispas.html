<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>CHISPAS · Feria Nocturna</title>
<style>
  html,body{margin:0;height:100%;background:#07050f;overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-tap-highlight-color:transparent;}
  canvas{display:block;touch-action:none;}
  #ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;justify-content:center;
      padding:8px;pointer-events:none;z-index:10;}
  #ui button{pointer-events:auto;cursor:pointer;border:1px solid #3a2f5c;border-radius:8px;
      background:rgba(20,16,38,.82);color:#cfc6f0;font:600 11px ui-monospace,monospace;
      padding:6px 10px;letter-spacing:.5px;transition:background .15s,border-color .15s;}
  #ui button:hover{background:rgba(40,32,70,.95);border-color:#6b57b8;}
  #ui button.off{opacity:.42;}
  #ui button:focus-visible{outline:2px solid #ffd23f;outline-offset:2px;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <button id="btnSound" aria-pressed="true">🔊 Sonido</button>
  <button id="btnShake" aria-pressed="true">📳 Sacudida</button>
  <button id="btnFlash" aria-pressed="true">✨ Destellos</button>
</div>
<script>
(function(){
'use strict';

/* =========================================================
   CHISPAS · Feria Nocturna
   Vanilla Canvas2D. Sin dependencias. Sin assets externos.
   ========================================================= */

const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha:false });

let W=0, H=0, DPR=1;
const arena = { x:0, y:0, r:0 };
let FOCO_R = 100;

const opts = { sound:true, shake:true, flash:true };

const state = {
  mode:'menu',            // 'menu' | 'play' | 'over'
  time:0,
  roundLen:90,
  remaining:90,
  shake:0,
  flash:0,
  hitstop:0,
  endTimer:0,
};

let cars = [];
let player = null;

/* ---------------- tuning ---------------- */
const CAR_R      = 21;
const THRUST     = 1200;
const MAX_SPEED  = 460;
const DAMP       = 2.4;
const RESTITUTION= 0.55;
const MIN_CHARGE = 25;      // chispa mínima para descargar
const MULT_FOCO  = 3;       // multiplicador dentro del foco
const DISCHARGE_CD = 0.75;

const COLORS = ['#ffd23f', '#ff4d6d', '#4dd4ff', '#8affc1'];
const NAMES  = ['TÚ', 'ROJO', 'CIAN', 'VERDE'];

/* ---------------- utilidades ---------------- */
function hexA(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function angTo(a,b){
  let d = b - a;
  while (d >  Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return d;
}
function roundRect(c,x,y,w,h,r){
  r = Math.min(r, w*0.5, h*0.5);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

/* ---------------- audio (sintetizado) ---------------- */
let actx=null, master=null;

function ensureAudio(){
  if (actx) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.30;
    master.connect(actx.destination);
  }catch(e){ actx = null; }
}
function audioReady(){
  if (!actx) return false;
  if (actx.state === 'suspended') actx.resume();
  return opts.sound;
}

function sfxBump(impact){
  if (!audioReady()) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(120 + Math.min(360, impact*0.9), t);
  o.frequency.exponentialRampToValueAtTime(55, t + 0.11);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.2);
}

function sfxDischarge(power, inFoco){
  if (!audioReady()) return;
  const t = actx.currentTime;
  // barrido
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sawtooth';
  const f0 = inFoco ? 900 : 520;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(70, t + 0.36);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.20 + power*0.0012, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.45);
  // chispa aguda
  if (inFoco){
    const o2 = actx.createOscillator(), g2 = actx.createGain();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(1320, t);
    o2.frequency.exponentialRampToValueAtTime(2200, t + 0.14);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.10, t + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o2.connect(g2); g2.connect(master);
    o2.start(t); o2.stop(t + 0.25);
  }
}

function sfxTone(freq, dur, type, vol){
  if (!audioReady()) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}

/* ---------------- partículas ---------------- */
const particles = [];
const MAX_PARTICLES = 520;

function addParticle(p){
  if (particles.length >= MAX_PARTICLES) return;
  particles.push(p);
}
function spawnSparks(x, y, count, speed, color){
  for (let i=0;i<count;i++){
    const a = Math.random()*TAU;
    const s = speed*(0.25 + Math.random()*0.9);
    addParticle({
      type:'spark', x, y,
      vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:0.35 + Math.random()*0.45, maxLife:0.8,
      color, size:1.2 + Math.random()*1.6
    });
  }
}
function spawnRing(x, y, maxR, color, life){
  addParticle({ type:'ring', x, y, r:6, maxR, life:life||0.45, maxLife:life||0.45, color });
}
function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i,1); continue; }
    if (p.type === 'spark'){
      p.x += p.vx*dt; p.y += p.vy*dt;
      const d = Math.exp(-3.5*dt);
      p.vx *= d; p.vy *= d;
    } else if (p.type === 'ring'){
      const t = 1 - p.life/p.maxLife;
      p.r = 6 + (p.maxR-6)*t;
    }
  }
}
function drawParticles(){
  for (const p of particles){
    const a = clamp(p.life/p.maxLife, 0, 1);
    if (p.type === 'spark'){
      ctx.strokeStyle = hexA(p.color, a);
      ctx.lineWidth = p.size;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx*0.022, p.y - p.vy*0.022);
      ctx.stroke();
    } else if (p.type === 'ring'){
      ctx.strokeStyle = hexA(p.color, a*0.85);
      ctx.lineWidth = 3*a + 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.stroke();
    }
  }
}

/* ---------------- textos flotantes ---------------- */
const floaters = [];
function addFloater(x, y, text, color, big){
  floaters.push({ x, y, text, color, life:1.1, maxLife:1.1, big:!!big });
}
function updateFloaters(dt){
  for (let i=floaters.length-1;i>=0;i--){
    const f = floaters[i];
    f.life -= dt;
    f.y -= 52*dt;
    if (f.life <= 0) floaters.splice(i,1);
  }
}

/* ---------------- creación de coches ---------------- */
function makeCar(i, isPlayer){
  const a = -Math.PI/2 + (i/4)*TAU;
  return {
    x: arena.x + Math.cos(a)*arena.r*0.58,
    y: arena.y + Math.sin(a)*arena.r*0.58,
    vx:0, vy:0,
    angle: a + Math.PI,
    r: CAR_R,
    mass: 1,
    color: COLORS[i],
    name: NAMES[i],
    isPlayer,
    chispa: 0,
    score: 0,
    cd: 0,
    inFoco: false,
    hitFlash: 0,
    ai: {
      greed: 40 + Math.random()*55,
      seed: Math.random()*1000,
      overTimer: 0
    }
  };
}

function startGame(){
  ensureAudio();
  cars = [];
  for (let i=0;i<4;i++) cars.push(makeCar(i, i===0));
  player = cars[0];
  state.mode = 'play';
  state.remaining = state.roundLen;
  state.time = 0;
  state.shake = 0;
  state.flash = 0;
  state.hitstop = 0;
  particles.length = 0;
  floaters.length = 0;
}

/* ---------------- física de un coche ---------------- */
function updateCar(c, dt, ix, iy){
  c.mass = 1 + c.chispa/180;

  const m = Math.hypot(ix, iy);
  if (m > 1){ ix/=m; iy/=m; }

  const accel = THRUST / c.mass;
  c.vx += ix * accel * dt;
  c.vy += iy * accel * dt;

  const damp = Math.exp(-DAMP*dt);
  c.vx *= damp;
  c.vy *= damp;

  const sp = Math.hypot(c.vx, c.vy);
  if (sp > MAX_SPEED){
    c.vx = c.vx/sp*MAX_SPEED;
    c.vy = c.vy/sp*MAX_SPEED;
  }

  c.x += c.vx*dt;
  c.y += c.vy*dt;

  // límite circular
  const dx = c.x - arena.x, dy = c.y - arena.y;
  const d = Math.hypot(dx, dy) || 1;
  const lim = arena.r - c.r;
  if (d > lim){
    const nx = dx/d, ny = dy/d;
    c.x = arena.x + nx*lim;
    c.y = arena.y + ny*lim;
    const vn = c.vx*nx + c.vy*ny;
    if (vn > 0){
      c.vx -= vn*nx*1.55;
      c.vy -= vn*ny*1.55;
      if (vn > 140){
        spawnSparks(c.x - nx*c.r, c.y - ny*c.r, 5, vn*0.5, c.color);
        state.shake = Math.min(state.shake + vn*0.0012, 6);
        sfxBump(vn*0.6);
      }
    }
  }

  // orientación hacia la velocidad
  if (sp > 25){
    const target = Math.atan2(c.vy, c.vx);
    c.angle += angTo(c.angle, target) * (1 - Math.exp(-13*dt));
  }

  if (c.cd > 0) c.cd = Math.max(0, c.cd - dt);
  if (c.hitFlash > 0) c.hitFlash = Math.max(0, c.hitFlash - dt*3.6);
}

/* ---------------- colisión círculo-círculo ---------------- */
function collide(a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const d = Math.hypot(dx, dy);
  const minD = a.r + b.r;
  if (d >= minD || d < 0.0001) return;

  const nx = dx/d, ny = dy/d;
  const invA = 1/a.mass, invB = 1/b.mass;
  const tot = invA + invB;
  const overlap = minD - d;

  a.x -= nx * overlap * (invA/tot);
  a.y -= ny * overlap * (invA/tot);
  b.x += nx * overlap * (invB/tot);
  b.y += ny * overlap * (invB/tot);

  const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
  const vn = rvx*nx + rvy*ny;
  if (vn > 0) return;   // ya se separan

  const j = -(1 + RESTITUTION) * vn / tot;
  a.vx -= j*nx*invA; a.vy -= j*ny*invA;
  b.vx += j*nx*invB; b.vy += j*ny*invB;

  const impact = Math.abs(vn);
  if (impact > 42){
    const gain = Math.min(40, 4 + impact*0.07);
    a.chispa = Math.min(100, a.chispa + gain);
    b.chispa = Math.min(100, b.chispa + gain);
    a.hitFlash = 1;
    b.hitFlash = 1;

    const mx = a.x + nx*a.r, my = a.y + ny*a.r;
    spawnSparks(mx, my, Math.min(16, 4 + (impact*0.04)|0), impact*0.9, '#ffe9a8');
    spawnRing(mx, my, 30 + impact*0.12, a.color, 0.3);

    if (opts.shake) state.shake = Math.min(state.shake + impact*0.014, 14);
    if (opts.flash && impact > 220) state.flash = Math.min(state.flash + 0.10, 0.30);

    if (impact > 210) state.hitstop = Math.min(0.07, impact*0.00022);
    sfxBump(impact);
  }
}

/* ---------------- descarga ---------------- */
function tryDischarge(c){
  if (c.cd > 0 || c.chispa < MIN_CHARGE) return false;

  const inFoco = Math.hypot(c.x - arena.x, c.y - arena.y) < FOCO_R;
  const power  = c.chispa;
  const pts    = Math.round(power * (inFoco ? MULT_FOCO : 1));

  c.score += pts;
  c.chispa = 0;
  c.cd = DISCHARGE_CD;

  // onda de choque
  const RANGE = 140;
  for (const o of cars){
    if (o === c) continue;
    const dx = o.x - c.x, dy = o.y - c.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < RANGE){
      const f = (1 - d/RANGE) * (340 + power*4.2) / o.mass;
      o.vx += (dx/d) * f;
      o.vy += (dy/d) * f;
      o.chispa = Math.min(100, o.chispa + 5);
      o.hitFlash = 0.7;
    }
  }

  // feedback
  const col = inFoco ? '#ffd23f' : c.color;
  spawnRing(c.x, c.y, 150 + power*1.1, col, 0.5);
  spawnSparks(c.x, c.y, inFoco ? 26 : 14, 260 + power*3, col);
  addFloater(c.x, c.y - c.r - 14, '+' + pts + (inFoco ? '  ×3' : ''), col, inFoco);

  if (opts.shake) state.shake = Math.min(state.shake + (inFoco ? 12 : 6), 22);
  if (opts.flash && inFoco) state.flash = Math.min(state.flash + 0.35, 0.55);

  sfxDischarge(power, inFoco);
  if (inFoco) sfxTone(880, 0.16, 'triangle', 0.07);
  return true;
}

/* ---------------- IA ---------------- */
function updateAI(c, dt){
  const ai = c.ai;
  const distC = Math.hypot(c.x - arena.x, c.y - arena.y);

  let tx = arena.x, ty = arena.y;

  if (c.chispa >= ai.greed){
    tx = arena.x; ty = arena.y;
  } else {
    let best = null, bd = Infinity;
    for (const o of cars){
      if (o === c) continue;
      const d = Math.hypot(o.x - c.x, o.y - c.y);
      if (d < bd){ bd = d; best = o; }
    }
    if (best){
      tx = best.x + best.vx*0.22;
      ty = best.y + best.vy*0.22;
    }
  }

  let dx = tx - c.x, dy = ty - c.y;
  const dl = Math.hypot(dx, dy) || 1;
  dx /= dl; dy /= dl;

  // evitar paredes
  const edge = arena.r - 80;
  if (distC > edge){
    const w = clamp((distC - edge)/80, 0, 1);
    const inx = (arena.x - c.x)/distC;
    const iny = (arena.y - c.y)/distC;
    dx += inx * w * 2.6;
    dy += iny * w * 2.6;
    const l = Math.hypot(dx, dy) || 1;
    dx /= l; dy /= l;
  }

  // jitter orgánico para que no se apilen
  const j = Math.sin(state.time*1.9 + ai.seed) * 0.18;
  const cj = Math.cos(j), sj = Math.sin(j);
  const rx = dx*cj - dy*sj;
  const ry = dx*sj + dy*cj;

  updateCar(c, dt, rx, ry);

  // decisión de descarga
  if (c.cd <= 0 && c.chispa >= MIN_CHARGE){
    const inFocoNow = Math.hypot(c.x - arena.x, c.y - arena.y) < FOCO_R*0.9;
    if (inFocoNow && c.chispa >= ai.greed){
      tryDischarge(c);
      ai.overTimer = 0;
    } else if (c.chispa >= 92){
      ai.overTimer += dt;
      if (ai.overTimer > 2.2){   // demasiado cargado = demasiado lento
        tryDischarge(c);
        ai.overTimer = 0;
      }
    } else {
      ai.overTimer = 0;
    }
  }
}

/* ---------------- input ---------------- */
const keys = Object.create(null);
let touchStick = null;
const touchVec = { x:0, y:0 };

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k] = true;

  ensureAudio();
  if (actx && actx.state === 'suspended') actx.resume();

  if (k === ' '){
    if (state.mode === 'play' && player) tryDischarge(player);
    else if (state.mode === 'menu') startGame();
    else if (state.mode === 'over' && state.endTimer > 0.6) startGame();
  }
  if (k === 'enter'){
    if (state.mode === 'menu') startGame();
    else if (state.mode === 'over' && state.endTimer > 0.6) startGame();
  }
  if (k === 'r' && state.mode === 'play') startGame();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function readInput(){
  let x = 0, y = 0;
  if (keys['a'] || keys['arrowleft'])  x -= 1;
  if (keys['d'] || keys['arrowright']) x += 1;
  if (keys['w'] || keys['arrowup'])    y -= 1;
  if (keys['s'] || keys['arrowdown'])  y += 1;
  if (touchStick){
    x += touchVec.x;
    y += touchVec.y;
  }
  return { x, y };
}

/* touch */
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  if (actx && actx.state === 'suspended') actx.resume();

  if (state.mode !== 'play'){
    if (state.mode === 'menu' || state.endTimer > 0.6) startGame();
    return;
  }
  if (e.pointerType === 'touch'){
    if (e.clientX < W/2 && !touchStick){
      touchStick = { id:e.pointerId, ox:e.clientX, oy:e.clientY, cx:e.clientX, cy:e.clientY };
      touchVec.x = 0; touchVec.y = 0;
    } else if (e.clientX >= W/2 && player){
      tryDischarge(player);
    }
  }
}, { passive:true });

canvas.addEventListener('pointermove', e => {
  if (!touchStick || e.pointerId !== touchStick.id) return;
  touchStick.cx = e.clientX;
  touchStick.cy = e.clientY;
  const R = 60;
  let dx = e.clientX - touchStick.ox;
  let dy = e.clientY - touchStick.oy;
  const d = Math.hypot(dx, dy);
  if (d > R){ dx = dx/d*R; dy = dy/d*R; }
  touchVec.x = dx/R;
  touchVec.y = dy/R;
}, { passive:true });

function endTouch(e){
  if (touchStick && e.pointerId === touchStick.id){
    touchStick = null;
    touchVec.x = 0; touchVec.y = 0;
  }
}
canvas.addEventListener('pointerup', endTouch, { passive:true });
canvas.addEventListener('pointercancel', endTouch, { passive:true });

/* ---------------- update global ---------------- */
function update(rawDt){
  state.time += rawDt;
  state.shake   *= Math.exp(-7.5*rawDt);
  state.flash   *= Math.exp(-5.5*rawDt);
  state.endTimer += rawDt;

  if (state.hitstop > 0){
    state.hitstop -= rawDt;
    return; // congelamos la simulación: el impacto se "siente"
  }

  if (state.mode === 'play'){
    state.remaining -= rawDt;
    if (state.remaining <= 0){
      state.remaining = 0;
      state.mode = 'over';
      state.endTimer = 0;
      sfxTone(440, 0.5, 'triangle', 0.10);
      return;
    }

    const input = readInput();
    for (const c of cars){
      if (c.isPlayer) updateCar(c, rawDt, input.x, input.y);
      else updateAI(c, rawDt);
    }

    for (let i=0;i<cars.length;i++)
      for (let j=i+1;j<cars.length;j++)
        collide(cars[i], cars[j]);

    for (const c of cars){
      c.inFoco = Math.hypot(c.x - arena.x, c.y - arena.y) < FOCO_R;
    }
  }

  updateParticles(rawDt);
  updateFloaters(rawDt);
}

/* ---------------- render ---------------- */
function render(){
  // reset transform + shake
  let sx = 0, sy = 0;
  if (opts.shake && state.shake > 0.15){
    sx = (Math.random()-0.5) * state.shake;
    sy = (Math.random()-0.5) * state.shake;
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.translate(sx, sy);

  // fondo
  const bg = ctx.createRadialGradient(W*0.5, H*0.55, 40, W*0.5, H*0.55, Math.max(W,H)*0.85);
  bg.addColorStop(0, '#151030');
  bg.addColorStop(0.55, '#0a0718');
  bg.addColorStop(1, '#05030c');
  ctx.fillStyle = bg;
  ctx.fillRect(-40, -40, W+80, H+80);

  drawFerrisWheel();

  // suelo de la arena
  const floor = ctx.createRadialGradient(arena.x, arena.y, 10, arena.x, arena.y, arena.r);
  floor.addColorStop(0, '#1e1740');
  floor.addColorStop(0.75, '#120d26');
  floor.addColorStop(1, '#0b0817');
  ctx.fillStyle = floor;
  ctx.beginPath(); ctx.arc(arena.x, arena.y, arena.r, 0, TAU); ctx.fill();

  // anillos del suelo
  ctx.strokeStyle = 'rgba(120,100,200,0.075)';
  ctx.lineWidth = 1;
  for (let i=1;i<=4;i++){
    ctx.beginPath();
    ctx.arc(arena.x, arena.y, arena.r*(i/5), 0, TAU);
    ctx.stroke();
  }

  drawStringLights();
  drawFoco();

  // partículas bajo los coches
  drawParticles();

  // coches
  for (const c of cars) drawCar(c);

  drawFloaters();
  drawHUD();
  drawTouchStick();

  // flash global (accesible: se puede desactivar)
  if (opts.flash && state.flash > 0.01){
    ctx.fillStyle = `rgba(255,225,140,${state.flash*0.5})`;
    ctx.fillRect(-40, -40, W+80, H+80);
  }

  if (state.mode === 'menu') drawMenu();
  if (state.mode === 'over') drawGameOver();
}

function drawFerrisWheel(){
  const cx = W*0.12, cy = H*0.20;
  const R  = Math.min(W,H)*0.14;
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.strokeStyle = '#7a63d6';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
  const rot = state.time*0.18;
  for (let i=0;i<10;i++){
    const a = rot + (i/10)*TAU;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a)*R, cy + Math.sin(a)*R);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a)*R, cy + Math.sin(a)*R, 3.2, 0, TAU);
    ctx.fillStyle = '#9f8ae8';
    ctx.fill();
  }
  ctx.restore();
}

function drawStringLights(){
  const N = 26;
  const R = arena.r + 34;
  for (let i=0;i<N;i++){
    const a = (i/N)*TAU + state.time*0.04;
    const x = arena.x + Math.cos(a)*R;
    const y = arena.y + Math.sin(a)*R;
    const pulse = 0.45 + 0.55*Math.sin(state.time*2.2 + i*0.9);
    const alpha = 0.15 + pulse*0.35 + state.flash*1.2;
    ctx.fillStyle = `rgba(255,216,120,${clamp(alpha,0,1)*0.8})`;
    ctx.beginPath();
    ctx.arc(x, y, 2.4 + pulse*1.6, 0, TAU);
    ctx.fill();
  }
  // aro de la arena
  ctx.strokeStyle = 'rgba(150,120,255,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(arena.x, arena.y, arena.r, 0, TAU); ctx.stroke();
}

function drawFoco(){
  const pulse = 0.5 + 0.5*Math.sin(state.time*2.6);
  const R = FOCO_R;

  const g = ctx.createRadialGradient(arena.x, arena.y, 0, arena.x, arena.y, R);
  g.addColorStop(0, `rgba(255,226,140,${0.30 + pulse*0.12})`);
  g.addColorStop(0.6, `rgba(255,180,60,${0.10 + pulse*0.06})`);
  g.addColorStop(1, 'rgba(255,150,40,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(arena.x, arena.y, R, 0, TAU); ctx.fill();

  ctx.strokeStyle = `rgba(255,214,120,${0.35 + pulse*0.25})`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(arena.x, arena.y, R, 0, TAU); ctx.stroke();

  // aro discontinuo giratorio
  ctx.save();
  ctx.translate(arena.x, arena.y);
  ctx.rotate(state.time*0.7);
  ctx.strokeStyle = `rgba(255,240,180,${0.18 + pulse*0.14})`;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([10, 14]);
  ctx.beginPath(); ctx.arc(0, 0, R*0.80, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawCar(c){
  const sp = c.chispa/100;
  ctx.save();
  ctx.translate(c.x, c.y);

  // glow
  const glowR = c.r * (1.9 + sp*1.3);
  const g = ctx.createRadialGradient(0,0,0,0,0,glowR);
  g.addColorStop(0, hexA(c.color, 0.26 + sp*0.30));
  g.addColorStop(1, hexA(c.color, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,glowR,0,TAU); ctx.fill();

  ctx.rotate(c.angle);

  // parachoques
  ctx.strokeStyle = hexA(c.color, 0.85);
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0,0,c.r,0,TAU); ctx.stroke();

  // carrocería
  ctx.fillStyle = '#141026';
  roundRect(ctx, -c.r*0.74, -c.r*0.60, c.r*1.52, c.r*1.20, 7);
  ctx.fill();
  ctx.strokeStyle = hexA(c.color, 0.5);
  ctx.lineWidth = 1.8;
  ctx.stroke();

  // parabrisas
  ctx.fillStyle = hexA(c.color, 0.22);
  roundRect(ctx, -c.r*0.10, -c.r*0.42, c.r*0.55, c.r*0.84, 4);
  ctx.fill();

  // faro delantero
  ctx.fillStyle = hexA(c.color, 0.95);
  ctx.beginPath(); ctx.arc(c.r*0.60, 0, 3.1, 0, TAU); ctx.fill();

  ctx.restore();

  // pértiga / chispa central
  const pr = 2.6 + sp*3.4;
  const gg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, pr*3.2);
  gg.addColorStop(0, `rgba(255,255,230,${0.55 + sp*0.45})`);
  gg.addColorStop(1, 'rgba(255,220,120,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(c.x, c.y, pr*3.2, 0, TAU); ctx.fill();

  // hit flash
  if (c.hitFlash > 0.01){
    ctx.fillStyle = `rgba(255,255,255,${c.hitFlash*0.55})`;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r + 4, 0, TAU); ctx.fill();
  }

  // arco de chispa encima
  if (c.chispa > 1){
    const r = c.r + 11;
    const a0 = -Math.PI*0.85;
    const a1 = a0 + (c.chispa/100) * Math.PI*1.7;
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(c.x, c.y, r, a0, a0 + Math.PI*1.7); ctx.stroke();
    ctx.strokeStyle = c.chispa >= MIN_CHARGE ? '#ffe27a' : hexA(c.color, 0.95);
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(c.x, c.y, r, a0, a1); ctx.stroke();
  }

  // marca de jugador
  if (c.isPlayer){
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r + 18, 0, TAU); ctx.stroke();
  }
}

function drawFloaters(){
  ctx.textAlign = 'center';
  for (const f of floaters){
    const a = clamp(f.life/f.maxLife, 0, 1);
    ctx.font = `700 ${f.big ? 24 : 17}px ui-monospace, monospace`;
    ctx.fillStyle = hexA(f.color, a);
    ctx.fillText(f.text, f.x, f.y);
  }
}

function drawHUD(){
  if (state.mode === 'menu') return;

  ctx.textBaseline = 'top';

  // --- jugador ---
  ctx.textAlign = 'left';
  ctx.font = '600 11px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(255,210,63,0.7)';
  ctx.fillText('TÚ', 24, 22);
  ctx.font = '700 34px ui-monospace, monospace';
  ctx.fillStyle = '#ffd23f';
  ctx.fillText(String(player ? player.score : 0), 24, 38);

  // barra de chispa
  const bw = 168, bh = 9, bx = 24, by = 82;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  roundRect(ctx, bx, by, bw, bh, 5); ctx.fill();
  const pct = player ? player.chispa/100 : 0;
  if (pct > 0){
    const ready = player.chispa >= MIN_CHARGE;
    ctx.fillStyle = ready ? '#ffe27a' : 'rgba(255,210,63,0.55)';
    roundRect(ctx, bx, by, Math.max(4, bw*pct), bh, 5); ctx.fill();
  }
  ctx.font = '600 10px ui-monospace, monospace';
  ctx.fillStyle = ready(player) ? '#ffe27a' : 'rgba(200,190,230,0.5)';
  ctx.fillText(ready(player) ? 'ESPACIO → DESCARGAR' : 'CHOCA PARA CARGAR', bx, by + 15);

  // --- temporizador ---
  ctx.textAlign = 'center';
  ctx.font = '700 26px ui-monospace, monospace';
  const lowTime = state.remaining <= 10;
  ctx.fillStyle = lowTime ? '#ff4d6d' : 'rgba(230,225,255,0.85)';
  ctx.fillText(fmtTime(state.remaining), W/2, 22);

  // --- rivales ---
  ctx.textAlign = 'right';
  let y = 24;
  for (let i=1;i<cars.length;i++){
    const c = cars[i];
    ctx.font = '700 15px ui-monospace, monospace';
    ctx.fillStyle = hexA(c.color, 0.9);
    ctx.fillText(String(c.score), W - 24, y);
    ctx.font = '600 10px ui-monospace, monospace';
    ctx.fillStyle = hexA(c.color, 0.45);
    ctx.fillText(c.name, W - 24 - 46, y + 3);
    y += 24;
  }
}
function ready(p){ return !!p && p.chispa >= MIN_CHARGE; }

function fmtTime(s){
  s = Math.max(0, Math.ceil(s));
  const m = Math.floor(s/60), r = s%60;
  return m + ':' + (r<10?'0':'') + r;
}

function drawTouchStick(){
  if (!touchStick) return;
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = '#ffd23f';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(touchStick.ox, touchStick.oy, 60, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(touchStick.cx, touchStick.cy, 22, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawMenu(){
  ctx.fillStyle = 'rgba(5,3,12,0.62)';
  ctx.fillRect(-40,-40,W+80,H+80);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const cy = H*0.42;

  ctx.font = '800 ' + Math.min(72, W*0.11) + 'px ui-monospace, monospace';
  ctx.fillStyle = '#ffd23f';
  ctx.shadowColor = 'rgba(255,210,63,0.55)';
  ctx.shadowBlur = 32;
  ctx.fillText('CHISPAS', W/2, cy);
  ctx.shadowBlur = 0;

  ctx.font = '600 12px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(190,180,225,0.75)';
  ctx.fillText('F E R I A   N O C T U R N A', W/2, cy + 46);

  ctx.font = '500 14px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(230,225,255,0.82)';
  ctx.fillText('Choca para cargar chispa.', W/2, cy + 96);
  ctx.fillStyle = 'rgba(255,210,63,0.9)';
  ctx.fillText('Descárgala dentro del foco central → ×3 puntos.', W/2, cy + 118);

  ctx.fillStyle = 'rgba(180,170,215,0.6)';
  ctx.font = '500 12px ui-monospace, monospace';
  ctx.fillText('WASD / Flechas  ·  ESPACIO descargar', W/2, cy + 156);

  const blink = 0.5 + 0.5*Math.sin(state.time*3.4);
  ctx.font = '700 15px ui-monospace, monospace';
  ctx.fillStyle = `rgba(255,255,255,${0.45 + blink*0.5})`;
  ctx.fillText('PULSA  ESPACIO  PARA JUGAR', W/2, cy + 200);
}

function drawGameOver(){
  ctx.fillStyle = 'rgba(5,3,12,0.72)';
  ctx.fillRect(-40,-40,W+80,H+80);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const sorted = cars.slice().sort((a,b)=> b.score - a.score);

  ctx.font = '800 44px ui-monospace, monospace';
  ctx.fillStyle = '#ffd23f';
  ctx.fillText('FIN DE RONDA', W/2, H*0.26);

  const winner = sorted[0];
  ctx.font = '700 18px ui-monospace, monospace';
  ctx.fillStyle = hexA(winner.color, 0.95);
  ctx.fillText(
    (winner.isPlayer ? '¡GANAS TÚ!' : 'GANA ' + winner.name) + '  ·  ' + winner.score + ' pts',
    W/2, H*0.33
  );

  let y = H*0.42;
  for (let i=0;i<sorted.length;i++){
    const c = sorted[i];
    ctx.font = '700 20px ui-monospace, monospace';
    ctx.fillStyle = hexA(c.color, c.isPlayer ? 1 : 0.8);
    ctx.fillText((i+1) + '.  ' + c.name.padEnd(6,' ') + '  ' + String(c.score).padStart(5,' '), W/2, y);
    y += 34;
  }

  if (state.endTimer > 0.6){
    const blink = 0.5 + 0.5*Math.sin(state.time*3.4);
    ctx.font = '700 14px ui-monospace, monospace';
    ctx.fillStyle = `rgba(255,255,255,${0.4 + blink*0.45})`;
    ctx.fillText('ESPACIO / ENTER  ·  REVANCHA', W/2, y + 44);
  }
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 1/25) dt = 1/25;   // clamp: evita saltos al volver de otra pestaña
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---------------- resize ---------------- */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W*DPR);
  canvas.height = Math.floor(H*DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  arena.x = W/2;
  arena.y = H/2;
  arena.r = Math.min(W, H) * 0.44;
  FOCO_R  = arena.r * 0.30;
}
window.addEventListener('resize', resize);

/* ---------------- botones de accesibilidad ---------------- */
const btnSound = document.getElementById('btnSound');
const btnShake = document.getElementById('btnShake');
const btnFlash = document.getElementById('btnFlash');

function syncButtons(){
  btnSound.classList.toggle('off', !opts.sound);
  btnShake.classList.toggle('off', !opts.shake);
  btnFlash.classList.toggle('off', !opts.flash);
  btnSound.setAttribute('aria-pressed', String(opts.sound));
  btnShake.setAttribute('aria-pressed', String(opts.shake));
  btnFlash.setAttribute('aria-pressed', String(opts.flash));
}
btnSound.addEventListener('click', () => {
  opts.sound = !opts.sound;
  if (opts.sound){ ensureAudio(); if (actx) actx.resume(); }
  syncButtons();
});
btnShake.addEventListener('click', () => { opts.shake = !opts.shake; if(!opts.shake) state.shake = 0; syncButtons(); });
btnFlash.addEventListener('click', () => { opts.flash = !opts.flash; if(!opts.flash) state.flash = 0; syncButtons(); });

/* ---------------- arranque ---------------- */
resize();
syncButtons();
requestAnimationFrame(frame);

})();
</script>
