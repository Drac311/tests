<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ceniza — Motocross 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: system-ui, sans-serif; background: #1a1210; }
  #hud {
    position: fixed; top: 16px; left: 16px; color: #ffd6b0;
    font-size: 14px; line-height: 1.6; pointer-events: none;
    text-shadow: 0 1px 3px #000;
  }
  #hud strong { color: #ff8a4c; }
  #msg {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #ffd6b0; font-size: 28px;
    font-weight: bold; pointer-events: none; opacity: 0;
    transition: opacity 0.3s; text-shadow: 0 2px 8px #000;
  }
  #msg.show { opacity: 1; }
</style>
</head>
<body>
<div id="hud">
  <div><strong>WASD / Flechas</strong> — acelerar, frenar, girar</div>
  <div><strong>R</strong> — reiniciar</div>
  <div style="margin-top:10px">Distancia: <span id="dist">0</span> m</div>
  <div>Velocidad: <span id="vel">0</span> km/h</div>
</div>
<div id="msg"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ---------- Escena ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a1a14);
scene.fog = new THREE.Fog(0x2a1a14, 40, 160);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xcc9977, 1.2);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffd6b0, 2.0);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// ---------- Física ----------
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -18, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = false;

// Materiales
const groundMat = new CANNON.Material('ground');
const bikeMat   = new CANNON.Material('bike');
world.addContactMaterial(new CANNON.ContactMaterial(groundMat, bikeMat, {
  friction: 0.6, restitution: 0.05
}));

// ---------- Terreno (una pista con colinas) ----------
function buildTrack() {
  const size = 4;
  const rows = 60;
  const cols = 1;
  const startZ = 10;
  const stepZ = 4;

  // Suelo estático base (caja grande invisible debajo)
  const baseBody = new CANNON.Body({ mass: 0, material: groundMat });
  baseBody.addShape(new CANNON.Box(new CANNON.Vec3(200, 1, 400)));
  baseBody.position.set(0, -1.5, -100);
  world.addBody(baseBody);

  // Segmentos de terreno con altura variable
  for (let i = 0; i < rows; i++) {
    const z = startZ - i * stepZ;
    const h = 0.5 + Math.sin(i * 0.35) * 1.2 + Math.cos(i * 0.15) * 0.8;
    const width = 14 + Math.sin(i * 0.2) * 3;

    // Colisión
    const body = new CANNON.Body({ mass: 0, material: groundMat });
    body.addShape(new CANNON.Box(new CANNON.Vec3(width / 2, h / 2, stepZ / 2)));
    body.position.set(0, h / 2, z);
    world.addBody(body);

    // Malla visual
    const geo = new THREE.BoxGeometry(width, h, stepZ);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.07, 0.35, 0.18 + Math.random() * 0.06),
      roughness: 0.95, metalness: 0
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, h / 2, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
  }
}
buildTrack();

// ---------- Moto (cuerpo + 2 ruedas) ----------
const chassisShape = new CANNON.Box(new CANNON.Vec3(0.45, 0.25, 0.9));
const chassisBody = new CANNON.Body({
  mass: 80,
  material: bikeMat,
  position: new CANNON.Vec3(0, 3, 8)
});
chassisBody.addShape(chassisShape);
world.addBody(chassisBody);

const wheelShape = new CANNON.Sphere(0.32);
const wheelOptions = {
  radius: 0.32,
  directionLocal: new CANNON.Vec3(0, -1, 0),
  suspensionStiffness: 30,
  suspensionRestLength: 0.3,
  frictionSlip: 1.8,
  dampingRelaxation: 2.3,
  dampingCompression: 4.4,
  maxSuspensionForce: 100000,
  rollInfluence: 0.01,
  axleLocal: new CANNON.Vec3(1, 0, 0),
  chassisConnectionPointLocal: new CANNON.Vec3(0, 0, 0),
  maxSuspensionTravel: 0.3,
  customSlidingRotationalSpeed: -30,
  useCustomSlidingRotationalSpeed: true
};

const vehicle = new CANNON.RaycastVehicle({
  chassisBody: chassisBody,
  indexRightAxis: 0,
  indexUpAxis: 1,
  indexForwardAxis: 2
});

// Rueda trasera
wheelOptions.chassisConnectionPointLocal = new CANNON.Vec3(0, -0.1, 0.65);
vehicle.addWheel(wheelOptions);
// Rueda delantera
wheelOptions.chassisConnectionPointLocal = new CANNON.Vec3(0, -0.1, -0.65);
vehicle.addWheel(wheelOptions);

vehicle.addToWorld(world);

// Malla visual de la moto (caja naranja + ruedas negras)
const bikeGroup = new THREE.Group();
const bodyMesh = new THREE.Mesh(
  new THREE.BoxGeometry(0.7, 0.4, 1.6),
  new THREE.MeshStandardMaterial({ color: 0xff6a2b, roughness: 0.5 })
);
bodyMesh.castShadow = true;
bikeGroup.add(bodyMesh);

const wheelMeshes = [];
for (let i = 0; i < 2; i++) {
  const wm = new THREE.Mesh(
    new THREE.CylinderGeometry(0.32, 0.32, 0.18, 16),
    new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 })
  );
  wm.rotation.z = Math.PI / 2;
  wm.castShadow = true;
  bikeGroup.add(wm);
  wheelMeshes.push(wm);
}
scene.add(bikeGroup);

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup',   e => keys[e.code] = false);

// ---------- HUD ----------
const distEl = document.getElementById('dist');
const velEl  = document.getElementById('vel');
const msgEl  = document.getElementById('msg');
const startZ = 8;
let maxZ = startZ;

function showMsg(text, ms = 1500) {
  msgEl.textContent = text;
  msgEl.classList.add('show');
  clearTimeout(showMsg._t);
  showMsg._t = setTimeout(() => msgEl.classList.remove('show'), ms);
}

// ---------- Reinicio ----------
function reset() {
  chassisBody.position.set(0, 3, 8);
  chassisBody.velocity.set(0, 0, 0);
  chassisBody.angularVelocity.set(0, 0, 0);
  chassisBody.quaternion.set(0, 0, 0, 1);
  maxZ = startZ;
  showMsg('Reiniciado');
}
addEventListener('keydown', e => { if (e.code === 'KeyR') reset(); });

// ---------- Bucle principal ----------
const clock = new THREE.Clock();
const forward = new CANNON.Vec3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // Física a paso fijo
  world.step(1 / 60, dt, 3);

  // Control de la moto
  const accel = keys['KeyW'] || keys['ArrowUp']   ? 1 : 0;
  const brake = keys['KeyS'] || keys['ArrowDown'] ? 1 : 0;
  const steer = (keys['KeyA'] || keys['ArrowLeft']  ? 1 : 0) -
                (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0);

  const speed = chassisBody.velocity.length();
  for (let i = 0; i < vehicle.wheelInfos.length; i++) {
    vehicle.applyEngineForce(accel * 800 - brake * 500, i);
    vehicle.setSteeringValue(steer * 0.5, i);
  }
  // Freno si se pulsa S y vamos rápido
  if (brake && speed > 1) {
    for (let i = 0; i < vehicle.wheelInfos.length; i++) {
      vehicle.setBrake(20, i);
    }
  } else {
    for (let i = 0; i < vehicle.wheelInfos.length; i++) {
      vehicle.setBrake(0, i);
    }
  }

  // Sincronizar malla de la moto con el chasis físico
  bikeGroup.position.copy(chassisBody.position);
  bikeGroup.quaternion.copy(chassisBody.quaternion);

  // Sincronizar ruedas visuales
  for (let i = 0; i < vehicle.wheelInfos.length; i++) {
    const t = vehicle.wheelInfos[i].worldTransform;
    wheelMeshes[i].position.copy(t.position);
    wheelMeshes[i].quaternion.copy(t.quaternion);
  }

  // Cámara persecución
  const targetPos = new THREE.Vector3().copy(chassisBody.position);
  const behind = new THREE.Vector3(0, 2.8, 7).applyQuaternion(bikeGroup.quaternion);
  const camTarget = targetPos.clone().add(behind);
  camera.position.lerp(camTarget, 0.08);
  camera.lookAt(targetPos.x, targetPos.y + 1.2, targetPos.z);

  // HUD
  const zNow = chassisBody.position.z;
  maxZ = Math.max(maxZ, startZ - zNow);
  distEl.textContent = Math.max(0, Math.round(maxZ));
  velEl.textContent = Math.round(speed * 3.6);

  // Condición de caída
  if (chassisBody.position.y < -10) {
    showMsg('¡Has caído! Pulsa R');
  }

  renderer.render(scene, camera);
}
animate();

// ---------- Resize ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
